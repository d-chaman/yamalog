<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="かぶビュー">
<meta name="theme-color" content="#131722">
<title>かぶビュー</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--surface:#f0f3fa;--raise:#ffffff;--line:#e0e3eb;
  --text:#131722;--muted:#6a6d78;--accent:#2962ff;--down:#f23645;
  --scrim:rgba(19,23,34,.4);color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131722;--surface:#1e222d;--raise:#1e222d;--line:#2a2e39;
    --text:#d1d4dc;--muted:#787b86;--scrim:rgba(0,0,0,.55);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131722;--surface:#1e222d;--raise:#1e222d;--line:#2a2e39;
  --text:#d1d4dc;--muted:#787b86;--scrim:rgba(0,0,0,.55);color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--text)}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Trebuchet MS",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  height:100dvh;overflow:hidden;padding-top:env(safe-area-inset-top,0px);
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:4px;height:52px;padding:0 6px 0 14px;border-bottom:1px solid var(--line);flex:none}
.listbtn{display:flex;align-items:center;gap:4px;background:none;border:0;font-size:19px;font-weight:700;min-width:0;padding:6px 0}
.listbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listbtn svg{flex:none;color:var(--muted)}
.spacer{flex:1}
.iconbtn{width:42px;height:42px;display:grid;place-items:center;background:none;border:0;border-radius:8px}
.iconbtn:active{background:var(--surface)}

main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.view.off{visibility:hidden;pointer-events:none}
.widget{flex:1;min-height:0}
.tradingview-widget-container,.tradingview-widget-container__widget{width:100%;height:100%}
.attr{flex:none;font-size:11px;color:var(--muted);text-align:right;padding:4px 12px}
.attr a{color:inherit}

.chips{flex:none;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--surface);border:0;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);padding:24px;text-align:center}

nav.tabs{flex:none;display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
.tab{flex:1;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);background:none;border:0}
.tab[aria-selected="true"]{color:var(--text)}
.tab[aria-selected="true"] svg{color:var(--accent)}

.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;font-weight:600}
.btn.danger{background:none;color:var(--down);width:100%;margin-top:20px;padding:12px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:16px;padding:6px 2px}

#overlay{position:fixed;inset:0;z-index:10;background:var(--scrim);opacity:0;transition:opacity .2s;display:flex;align-items:flex-end}
#overlay[hidden]{display:none}
#overlay.open{opacity:1}
.sheet{width:100%;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--raise);border-radius:14px 14px 0 0;
  padding:6px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(28px);transition:transform .2s}
#overlay.open .sheet{transform:none}
@media (min-width:640px){
  #overlay{align-items:center;justify-content:center}
  .sheet{max-width:480px;border-radius:14px}
}
@media (prefers-reduced-motion:reduce){#overlay,.sheet{transition:none}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheethead h2{font-size:17px}
.field{width:100%;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.field::placeholder{color:var(--muted)}
.label{font-size:13px;color:var(--muted);margin:18px 0 8px}
.addgrid{display:grid;grid-template-columns:1fr auto;gap:8px}
.addgrid #acode{grid-column:1/-1}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.hint.err{color:var(--down)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.row{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .main{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym{font-size:12px;color:var(--muted)}
.mini{width:36px;height:36px;flex:none;border-radius:8px;background:var(--surface);border:0;display:grid;place-items:center}
.mini:disabled{opacity:.3}
.listrow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:13px 0;text-align:left}
.listrow .main{flex:1;min-width:0}
.listrow .check{color:var(--accent);width:20px}
.newlist{margin-top:12px;width:100%;background:var(--surface);color:var(--text)}
.seg{display:flex;background:var(--surface);border-radius:8px;padding:2px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:6px;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--text)}
</style>
</head>
<body>

<header>
  <button class="listbtn" id="listBtn" aria-label="ウォッチリストを切り替え">
    <span id="listName"></span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="spacer"></div>
  <button class="iconbtn" id="addBtn" aria-label="銘柄を追加">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button class="iconbtn" id="editBtn" aria-label="リストを編集">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
  </button>
</header>

<main>
  <section class="view" id="viewWatch">
    <div class="widget" id="watchWidget"></div>
    <p class="attr"><a href="https://jp.tradingview.com/" target="_blank" rel="noopener">Data by TradingView</a></p>
  </section>
  <section class="view off" id="viewChart">
    <div class="chips" id="chips"></div>
    <div class="widget" id="chartWidget"></div>
  </section>
</main>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-tab="watch" aria-selected="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>
    ウォッチリスト
  </button>
  <button class="tab" role="tab" data-tab="chart" aria-selected="false">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v4M7 17v4M17 6v3M17 19v2"/><rect x="5" y="7" width="4" height="10" rx="1"/><rect x="15" y="9" width="4" height="10" rx="1"/></svg>
    チャート
  </button>
</nav>

<div id="overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
const STORE = 'kabuview:v1';
const TV = 'https://s3.tradingview.com/external-embedding/';
const PRESETS = [
  ['TSE:7203','トヨタ自動車'],['TSE:6758','ソニーG'],['TSE:8306','三菱UFJ'],['TSE:9984','ソフトバンクG'],
  ['TSE:7974','任天堂'],['TSE:8035','東京エレクトロン'],['TSE:6861','キーエンス'],['TSE:9983','ファーストリテイリング'],
  ['NASDAQ:AAPL','Apple'],['NASDAQ:NVDA','NVIDIA'],['NASDAQ:MSFT','Microsoft'],['NASDAQ:TSLA','Tesla'],
  ['NASDAQ:AMZN','Amazon'],['AMEX:SPY','S&P500 ETF'],['FX:USDJPY','ドル円'],['FX:EURJPY','ユーロ円']
];

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mk = (sym, name) => ({ s: sym, n: name });

function defaultState() {
  const a = uid(), b = uid(), c = uid();
  return {
    current: a, theme: 'auto', chartSymbol: '',
    lists: [
      { id: a, name: '日本株', symbols: [mk('TSE:7203','トヨタ自動車'), mk('TSE:6758','ソニーG'), mk('TSE:8306','三菱UFJ'), mk('TSE:9984','ソフトバンクG')] },
      { id: b, name: '米国株', symbols: [mk('NASDAQ:AAPL','Apple'), mk('NASDAQ:NVDA','NVIDIA'), mk('NASDAQ:MSFT','Microsoft'), mk('NASDAQ:TSLA','Tesla')] },
      { id: c, name: '為替', symbols: [mk('FX:USDJPY','ドル円'), mk('FX:EURJPY','ユーロ円')] }
    ]
  };
}
function load() {
  try {
    const v = JSON.parse(localStorage.getItem(STORE));
    if (v && Array.isArray(v.lists) && v.lists.length) return v;
  } catch (e) {}
  return defaultState();
}
let state = load();
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
const cur = () => state.lists.find(l => l.id === state.current) || state.lists[0];

/* 入力をTradingViewのシンボル形式へ */
function normalize(raw) {
  let s = raw.trim().toUpperCase().replace(/\s+/g, '').replace('：', ':');
  s = s.replace(/[０-９Ａ-Ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  if (!s) return '';
  if (/^\d{4}$/.test(s) || /^\d{3}[A-Z]$/.test(s)) return 'TSE:' + s;
  const m = s.match(/^(\d{4}|\d{3}[A-Z])\.T$/);
  if (m) return 'TSE:' + m[1];
  return s;
}

/* テーマ */
const mq = matchMedia('(prefers-color-scheme: dark)');
const themeName = () => state.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : state.theme;
function applyTheme() {
  const t = themeName();
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#131722' : '#ffffff';
}
mq.addEventListener('change', () => { if (state.theme === 'auto') { applyTheme(); renderAll(); } });

/* TradingViewウィジェットの埋め込み */
function mount(el, script, config) {
  el.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'tradingview-widget-container';
  const inner = document.createElement('div');
  inner.className = 'tradingview-widget-container__widget';
  wrap.appendChild(inner);
  const s = document.createElement('script');
  s.type = 'text/javascript'; s.async = true; s.src = TV + script;
  s.textContent = JSON.stringify(config);
  wrap.appendChild(s);
  el.appendChild(wrap);
}
const appUrl = () => location.href.split(/[?#]/)[0];

function emptyState(el) {
  el.innerHTML = '<div class="empty"><p>このリストにはまだ銘柄がありません</p><button class="btn">銘柄を追加</button></div>';
  el.querySelector('button').onclick = () => openEdit(true);
}

let watchKey = '', chartKey = '';
function renderWatch() {
  const l = cur(), el = $('#watchWidget');
  const key = JSON.stringify([l.id, l.name, l.symbols, themeName()]);
  if (key === watchKey) return;
  watchKey = key;
  if (!l.symbols.length) { emptyState(el); return; }
  mount(el, 'embed-widget-market-quotes.js', {
    width: '100%', height: '100%', locale: 'ja', colorTheme: themeName(),
    isTransparent: true, showSymbolLogo: true, largeChartUrl: appUrl(),
    symbolsGroups: [{ name: l.name, symbols: l.symbols.map(x => ({ name: x.s, displayName: x.n || x.s })) }]
  });
}

function renderChips() {
  const l = cur(), box = $('#chips');
  box.innerHTML = l.symbols.map((x, i) =>
    `<button class="chip" data-i="${i}" aria-pressed="${x.s === state.chartSymbol}">${esc(x.n || x.s)}</button>`).join('');
  box.style.display = l.symbols.length ? '' : 'none';
  const on = box.querySelector('[aria-pressed="true"]');
  if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
}
function renderChart() {
  const l = cur(), el = $('#chartWidget');
  if (!state.chartSymbol && l.symbols.length) state.chartSymbol = l.symbols[0].s;
  renderChips();
  if (!state.chartSymbol) { chartKey = ''; emptyState(el); return; }
  const key = JSON.stringify([state.chartSymbol, themeName()]);
  if (key === chartKey) return;
  chartKey = key;
  const dark = themeName() === 'dark';
  mount(el, 'embed-widget-advanced-chart.js', {
    autosize: true, symbol: state.chartSymbol, interval: 'D', timezone: 'Asia/Tokyo',
    theme: themeName(), style: '1', locale: 'ja', allow_symbol_change: true,
    hide_side_toolbar: true, calendar: false, save_image: false,
    backgroundColor: dark ? '#131722' : '#ffffff',
    gridColor: dark ? 'rgba(42,46,57,0.6)' : 'rgba(224,227,235,0.6)',
    support_host: 'https://www.tradingview.com'
  });
}
$('#chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.chartSymbol = cur().symbols[+b.dataset.i].s; save(); renderChart();
});

/* タブ */
let tab = 'watch';
function setTab(t) {
  tab = t;
  $('#viewWatch').classList.toggle('off', t !== 'watch');
  $('#viewChart').classList.toggle('off', t !== 'chart');
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  if (t === 'chart') renderChart(); else renderWatch();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));

function renderAll() {
  $('#listName').textContent = cur().name;
  renderWatch();
  if (tab === 'chart' || chartKey) renderChart();
}

/* ボトムシート */
const overlay = $('#overlay'), sheet = $('#sheet');
function openSheet(html, bind) {
  sheet.innerHTML = '<div class="grab"></div>' + html;
  bind && bind();
  if (overlay.hidden) {
    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add('open'));
  }
  sheet.scrollTop = 0;
}
function closeSheet() {
  overlay.classList.remove('open');
  setTimeout(() => { overlay.hidden = true; sheet.innerHTML = ''; }, 200);
  renderAll();
}
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });

function selectList(id) {
  if (state.current !== id) {
    state.current = id;
    state.chartSymbol = (cur().symbols[0] || {}).s || '';
    save();
  }
}

function openLists() {
  const rows = state.lists.map(l => `
    <button class="listrow" data-id="${l.id}">
      <span class="check">${l.id === cur().id ? '✓' : ''}</span>
      <span class="main"><span class="nm">${esc(l.name)}</span><br><span class="sym">${l.symbols.length}銘柄</span></span>
    </button>`).join('');
  const seg = [['auto','自動'],['dark','ダーク'],['light','ライト']].map(([v, t]) =>
    `<button data-theme="${v}" aria-pressed="${state.theme === v}">${t}</button>`).join('');
  openSheet(`
    <div class="sheethead"><h2>ウォッチリスト</h2><button class="link" id="done">閉じる</button></div>
    <div>${rows}</div>
    <button class="btn newlist" id="newList">＋ 新しいリスト</button>
    <p class="label">表示テーマ</p>
    <div class="seg">${seg}</div>`, () => {
    $('#done').onclick = closeSheet;
    sheet.querySelectorAll('.listrow').forEach(b => b.onclick = () => { selectList(b.dataset.id); closeSheet(); });
    $('#newList').onclick = () => {
      const name = (prompt('新しいリストの名前') || '').trim();
      if (!name) return;
      const l = { id: uid(), name: name.slice(0, 30), symbols: [] };
      state.lists.push(l); selectList(l.id); save();
      $('#listName').textContent = l.name;
      openEdit(true);
    };
    sheet.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
      state.theme = b.dataset.theme; save(); applyTheme();
      sheet.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
    });
  });
}

function openEdit(focusAdd) {
  const l = cur();
  openSheet(`
    <div class="sheethead"><h2>リストを編集</h2><button class="link" id="done">完了</button></div>
    <input class="field" id="lname" maxlength="30" aria-label="リスト名" value="${esc(l.name)}">
    <p class="label">銘柄を追加</p>
    <div class="addgrid">
      <input class="field" id="acode" placeholder="7203 や NASDAQ:AAPL" autocapitalize="characters" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="next" aria-label="銘柄コード">
      <input class="field" id="aname" placeholder="表示名（任意）" enterkeyhint="done" aria-label="表示名">
      <button class="btn" id="addSym">追加</button>
    </div>
    <p class="hint" id="msg">日本株は4桁のコードだけでOK。米国株や為替は「取引所:シンボル」で入力します（例 NYSE:KO、FX:USDJPY）。</p>
    <div class="presets" id="presets"></div>
    <p class="label" id="count"></p>
    <div id="rows"></div>
    ${state.lists.length > 1 ? '<button class="btn danger" id="delList">このリストを削除</button>' : ''}`, () => {
    const msg = $('#msg'), defaultMsg = msg.textContent;
    const say = (t, err) => { msg.textContent = t; msg.classList.toggle('err', !!err); };

    function rows() {
      $('#count').textContent = `${l.symbols.length}銘柄`;
      $('#rows').innerHTML = l.symbols.map((x, i) => `
        <div class="row">
          <div class="main"><div class="nm">${esc(x.n || x.s)}</div><div class="sym">${esc(x.s)}</div></div>
          <button class="mini" data-act="up" data-i="${i}" aria-label="上へ" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="mini" data-act="down" data-i="${i}" aria-label="下へ" ${i === l.symbols.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="mini" data-act="del" data-i="${i}" aria-label="削除" style="color:var(--down)">✕</button>
        </div>`).join('');
      const have = new Set(l.symbols.map(x => x.s));
      $('#presets').innerHTML = PRESETS.filter(p => !have.has(p[0])).slice(0, 10)
        .map(p => `<button class="chip" data-s="${p[0]}" data-n="${esc(p[1])}">＋ ${esc(p[1])}</button>`).join('');
    }
    function add(sym, name) {
      if (!sym) { say('銘柄コードを入力してください', true); return false; }
      if (l.symbols.some(x => x.s === sym)) { say(`${sym} はすでにこのリストにあります`, true); return false; }
      l.symbols.push(mk(sym, (name || '').trim().slice(0, 30)));
      save(); rows(); say(`${sym} を追加しました`);
      return true;
    }
    rows();

    $('#done').onclick = closeSheet;
    $('#lname').oninput = e => { l.name = e.target.value.trim() || '無題のリスト'; save(); $('#listName').textContent = l.name; };
    $('#acode').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#aname').focus(); } };
    $('#aname').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#addSym').click(); } };
    $('#acode').oninput = () => say(defaultMsg);
    $('#addSym').onclick = () => {
      if (add(normalize($('#acode').value), $('#aname').value)) {
        $('#acode').value = ''; $('#aname').value = ''; $('#acode').focus();
      }
    };
    $('#presets').onclick = e => { const b = e.target.closest('.chip'); if (b) add(b.dataset.s, b.dataset.n); };
    $('#rows').onclick = e => {
      const b = e.target.closest('.mini'); if (!b) return;
      const i = +b.dataset.i, a = l.symbols;
      if (b.dataset.act === 'up' && i > 0) [a[i - 1], a[i]] = [a[i], a[i - 1]];
      if (b.dataset.act === 'down' && i < a.length - 1) [a[i + 1], a[i]] = [a[i], a[i + 1]];
      if (b.dataset.act === 'del') {
        const [gone] = a.splice(i, 1);
        if (gone.s === state.chartSymbol) state.chartSymbol = (a[0] || {}).s || '';
      }
      save(); rows();
    };
    const del = $('#delList');
    if (del) del.onclick = () => {
      if (!confirm(`「${l.name}」を削除しますか？`)) return;
      state.lists = state.lists.filter(x => x.id !== l.id);
      selectList(state.lists[0].id); state.current = state.lists[0].id; save();
      closeSheet();
    };
    if (focusAdd) setTimeout(() => $('#acode').focus(), 250);
  });
}

$('#listBtn').onclick = openLists;
$('#addBtn').onclick = () => openEdit(true);
$('#editBtn').onclick = () => openEdit(false);

/* ウォッチリスト内の銘柄タップ（largeChartUrl経由）で開かれた場合はチャートを表示 */
const qs = new URLSearchParams(location.search).get('tvwidgetsymbol');
if (qs) { state.chartSymbol = qs; history.replaceState(null, '', appUrl()); }

applyTheme();
$('#listName').textContent = cur().name;
setTab(qs ? 'chart' : 'watch');
})();
</script>
</body>
</html>
